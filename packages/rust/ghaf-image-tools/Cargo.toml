[package]
name = "ghaf-image-tools"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared regular-file image construction tools for Ghaf"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustix = { version = "1.1", features = ["fs"] }
tempfile = "3.27"
