[package]
name = "ghaf-usb-passthrough-applet"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
notify-rust = "4.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-vsock = "0.7.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Pinned in Cargo.lock (not with `rev`) so that libcosmic crates pulled in by
# cosmic-panel resolve to the same revision. Keep it at the revision used by
# the COSMIC release on the target (nixpkgs cosmic-settings Cargo.lock);
# a newer libcosmic expects theme config keys that older COSMIC lacks.
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "tokio", "wayland"]
